id: webhook-secret-input
namespace: io.kestra.tests

inputs:
  - id: plaintext
    type: STRING
  - id: ciphertext
    type: SECRET

tasks:
  - id: log
    type: io.kestra.plugin.core.log.Log
    message: "{{ inputs.plaintext }}"

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: secret-input-key
    inputs:
      plaintext: "{{ trigger.body.plaintext }}"
      ciphertext: "{{ trigger.body.ciphertext }}"
